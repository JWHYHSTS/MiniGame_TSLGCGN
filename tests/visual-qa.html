<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pháo đài Cơ Khí · Visual QA</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/game.css"><style>body{background:#081e2c}.qa-nav{padding:18px 30px;display:flex;align-items:center;gap:14px;background:#102d3c;position:sticky;top:0;z-index:5}.qa-nav a{color:#eacf9f;padding:10px;font-size:16px}h1{font-size:21px;margin-right:auto}.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px;max-width:1150px;margin:auto}.qa-item{border:1px solid #63908e61;background:#0c2836;border-radius:7px;padding:17px 20px}.qa-item>.triangle-svg{height:220px}.qa-item h2{font-size:16px;margin:4px 0}.qa-item>.eyebrow{color:#b8d5d5}.qa-item p{font-size:14px;line-height:1.5;color:#bcd4d8}.qa-answer{font-size:19px;margin:5px 0;color:#ffdda0}.qa-expression{font-size:35px;padding:35px 15px;text-align:center}.qa-item .fraction{font-size:1em}.qa-item .math-value{font-size:1.3em}.qa-item .vertex-label{font-size:24px}.qa-item .length-label{font-size:22px}</style></head><body><nav class="qa-nav"><h1>Kiểm tra hình & đáp án</h1><a href="?map=1">M1</a><a href="?map=2">M2</a><a href="?map=3">M3</a><a href="?map=4">M4</a><a href="?map=5">M5</a><a href="?map=6">Boss</a></nav><div class="qa-grid" id="gallery"></div><script src="../js/config.js"></script><script src="../js/math-engine.js"></script><script src="../js/triangle.js"></script><script src="../js/question-engine.js"></script><script src="../js/validator.js"></script><script src="../js/ui.js"></script><script src="../js/teacher.js"></script><script>
const bank=Trig.Validator.validateBank(Trig.Questions.generateBank()).valid,map=Number(new URLSearchParams(location.search).get('map'))||1,pool=bank.filter(q=>q.map===map);
const selected=map===6?[1,2,3,4,5].flatMap(phase=>pool.filter(q=>q.phase===phase).slice(0,3)):map===2?[...pool.filter(q=>q.type==='build-ratio').filter((_,i)=>[0,1,2,3,12,13,14].includes(i)),pool[32],pool[33],pool[36]]:pool.slice(0,10);
document.getElementById('gallery').innerHTML=selected.map(q=>`<article class="qa-item" data-qid="${q.id}"><span class="eyebrow">${q.id} · ${q.status}</span><h2>${Trig.UI.e(q.prompt)}</h2>${q.mathData.triangle?Trig.Triangle.renderTriangle(q.mathData.triangle,{showLengths:q.type==='calculate-ratio',hideHyp:q.mathData.hideHyp,id:q.id}):`<div class="qa-expression">${Trig.Review.questionExpression(q)}</div>`}<div class="qa-answer">Đáp án: ${Trig.Review.answerHTML(q)}</div><p>${Trig.UI.e(q.explanation)}</p></article>`).join('');
</script></body></html>
